name: ECS env tag check
description: >-
  Checks that the digest a mutable ECR tag points to is the digest every
  running task of a given container of an ECS service runs, so the next
  Terraform apply would not silently roll out a different image. Read-only.
author: aifinyo-ag

inputs:
  repository:
    description: Name of the ECR repository that holds the image.
    required: true
  env-tag:
    description: Mutable tag the ECS task definition references, for example "stage".
    required: true
  cluster:
    description: Name of the ECS cluster the service runs on.
    required: true
  service:
    description: Name of the ECS service to check.
    required: true
  container:
    description: Name of the container (as defined in the task definition) whose running image digest is checked.
    required: true
  retry-seconds:
    description: >-
      Seconds to wait before the one re-read after a mismatch, in case a
      deploy is moving env-tag at that moment. A non-negative integer.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    # Inputs are passed through env: and read back as "$VAR" rather than
    # interpolated as ${{ inputs.* }} directly into the script, per
    # https://docs.github.com/en/actions/reference/security/secure-use
    - name: Check prerequisites
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        ENV_TAG: ${{ inputs.env-tag }}
        CLUSTER: ${{ inputs.cluster }}
        SERVICE: ${{ inputs.service }}
        CONTAINER: ${{ inputs.container }}
        RETRY_SECONDS: ${{ inputs.retry-seconds }}
      run: |
        [ -n "${REPOSITORY:-}" ] || { echo "::error::input 'repository' must not be empty"; exit 1; }
        [ -n "${ENV_TAG:-}" ] || { echo "::error::input 'env-tag' must not be empty"; exit 1; }
        [ -n "${CLUSTER:-}" ] || { echo "::error::input 'cluster' must not be empty"; exit 1; }
        [ -n "${SERVICE:-}" ] || { echo "::error::input 'service' must not be empty"; exit 1; }
        [ -n "${CONTAINER:-}" ] || { echo "::error::input 'container' must not be empty"; exit 1; }
        case "${RETRY_SECONDS:-}" in
          '' | *[!0-9]*) echo "::error::input 'retry-seconds' must be a non-negative integer"; exit 1 ;;
        esac

        command -v aws >/dev/null 2>&1 || { echo "::error::aws CLI not found on PATH; this action needs AWS CLI v2"; exit 1; }
        command -v ruby >/dev/null 2>&1 || { echo "::error::ruby not found on PATH; this action needs Ruby >= 3.2"; exit 1; }
        ruby -e 'exit(Gem::Version.new(RUBY_VERSION) >= Gem::Version.new("3.2") ? 0 : 1)' \
          || { echo "::error::ruby >= 3.2 required, found $(ruby -v)"; exit 1; }

    # Same env:-passthrough pattern as above.
    - name: Check the env tag against the running tasks
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        ENV_TAG: ${{ inputs.env-tag }}
        CLUSTER: ${{ inputs.cluster }}
        SERVICE: ${{ inputs.service }}
        CONTAINER: ${{ inputs.container }}
        RETRY_SECONDS: ${{ inputs.retry-seconds }}
      run: |
        ruby "$GITHUB_ACTION_PATH/ecs_env_tag_check.rb" "$REPOSITORY" "$ENV_TAG" "$CLUSTER" "$SERVICE" "$CONTAINER" "$RETRY_SECONDS"
